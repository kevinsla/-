<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="나만의 일정">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="나만의 일정">
  <title>나만의 일정</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/143.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; color: #1f2937; }
    .app-container { display: flex; flex-direction: column; height: 100dvh; max-width: 800px; margin: 0 auto; background-color: #ffffff; }

    /* 상단 탭 전환 메뉴 */
    .app-switcher { display: flex; background: #2563eb; padding: 6px; gap: 6px; flex-shrink: 0; }
    .switch-tab { flex: 1; background: rgba(255,255,255,0.2); border: none; border-radius: 4px; padding: 6px; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; }
    .switch-tab.active { background: #fff; color: #2563eb; }

    /* 상단: 달력 영역 */
    .top-calendar { flex: 0 0 25%; display: flex; flex-direction: column; justify-content: center; border-bottom: 2px solid #e5e7eb; background: #fff; padding: 4px 10px; }
    .calendar-header { position: relative; display: flex; justify-content: space-between; align-items: center; height: 24px; margin-bottom: 2px; }
    .calendar-header h2 { position: absolute; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 700; white-space: nowrap; pointer-events: none; }
    .header-left, .header-right { display: flex; gap: 4px; align-items: center; z-index: 1; }
    .nav-btn, .mode-btn { background: #f3f4f6; border: none; border-radius: 4px; padding: 3px 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .mode-btn { background-color: #eff6ff; color: #2563eb; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 9px; font-weight: 600; color: #6b7280; margin-bottom: 1px; }
    .weekdays div:first-child { color: #ef4444; }
    .weekdays div:last-child { color: #3b82f6; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .day-cell { aspect-ratio: 2.6; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; border-radius: 3px; cursor: pointer; background-color: #f9fafb; position: relative; }
    .day-cell.sun { color: #ef4444; }
    .day-cell.sat { color: #3b82f6; }
    .day-cell.today { font-weight: 800; background-color: #eff6ff; color: #2563eb; }
    .day-cell.selected { background-color: #2563eb; color: #ffffff !important; font-weight: 700; }
    .dot { width: 4px; height: 4px; background-color: #10b981; border-radius: 50%; position: absolute; bottom: 2px; }

    /* 뷰 패널 공통 */
    .view-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; background-color: #fafafa; }
    .view-panel.active { display: flex; }

    /* 1. 일정 관리 영역 스타일 */
    .schedule-input-area { display: flex; padding: 8px 10px; background: #fff; gap: 6px; border-bottom: 2px solid #e5e7eb; align-items: center; flex-shrink: 0; }
    .text-input { flex: 1; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; outline: none; }
    .action-btn { background-color: #2563eb; color: white; border: none; border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; height: 36px; }
    .date-insert-btn { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 10px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; height: 36px; }
    
    .schedule-list-area { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .record-group { margin-bottom: 6px; background: #fff; border-radius: 6px; padding: 6px 10px; border: 1px solid #e5e7eb; }
    .record-group-title { font-size: 11px; font-weight: 700; color: #2563eb; margin-bottom: 4px; border-bottom: 1px solid #f3f4f6; padding-bottom: 2px; }
    
    .schedule-item { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; font-size: 12px; border-bottom: 1px solid #f9fafb; }
    .schedule-left { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
    .schedule-text { flex: 1; word-break: break-all; }
    .schedule-text.completed { text-decoration: line-through; color: #9ca3af; }
    .delete-btn { background: none; border: none; color: #d1d5db; font-size: 14px; cursor: pointer; padding: 0 4px; }

    /* 2. 가계부 영역 스타일 */
    .expense-middle { flex: 0 0 45%; display: flex; background-color: #fafafa; border-bottom: 2px solid #e5e7eb; overflow: hidden; background: #fff; }
    .selector-panel { display: flex; width: 100%; padding: 6px 8px; gap: 8px; background: #fff; }
    
    .date-col { flex: 0 0 84px; display: flex; flex-direction: column; border-right: 1px solid #f0f0f0; padding-right: 6px; height: 100%; }
    .col-title-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-shrink: 0; }
    .col-title { font-size: 11px; font-weight: 700; color: #4b5563; }
    .edit-cat-btn { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 1px 5px; font-size: 9px; font-weight: bold; color: #4b5563; cursor: pointer; }
    .edit-cat-btn.active { background: #dc2626; color: #fff; border-color: #dc2626; }

    .vertical-date-scroll { position: relative; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; scrollbar-width: none; }
    .vertical-date-scroll::-webkit-scrollbar { display: none; }
    .date-chip { height: calc((100% - 16px) / 5); min-height: 26px; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; font-weight: 600; flex-shrink: 0; }
    .date-chip.active { background-color: #2563eb; color: #ffffff; border-color: #2563eb; }

    .category-col { flex: 1; display: flex; flex-direction: column; overflow-y: auto; height: 100%; }
    .category-cloud { display: flex; flex-wrap: wrap; gap: 8px 6px; align-content: flex-start; padding-top: 4px; padding-right: 4px; }
    
    .cat-chip { position: relative; padding: 6px 12px; font-size: 11px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; font-weight: 600; }
    .poke-badge { position: absolute; top: -7px; right: -5px; width: 18px; height: 18px; pointer-events: none; image-rendering: pixelated; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2)); }
    .cat-add-btn { padding: 6px 10px; font-size: 11px; border-radius: 14px; border: 1px dashed #9ca3af; background: #fff; color: #6b7280; cursor: pointer; font-weight: 600; }

    /* 아이폰 스타일 흔들림 애니메이션 */
    @keyframes wiggle {
      0% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
      100% { transform: rotate(-1.5deg); }
    }
    .cat-chip.wiggle {
      animation: wiggle 0.25s infinite ease-in-out;
      border: 2px dashed #dc2626 !important;
    }
    .cat-chip.to-delete {
      opacity: 0.5;
      background-color: #fee2e2 !important;
      color: #dc2626 !important;
    }

    .expense-feed-section { flex: 1; overflow-y: auto; padding: 6px 10px; }
    .record-item { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; font-size: 12px; }
    .record-info { display: flex; gap: 8px; align-items: center; cursor: pointer; flex: 1; }
    .badge { padding: 1px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; color: #fff; }
    .price { font-weight: 700; color: #111827; }

    /* 통계 화면 스타일 */
    .stats-view { flex: 1; background-color: #fafafa; overflow-y: auto; padding: 12px; display: none; }
    .income-box { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    .income-box label { font-size: 12px; font-weight: 700; }
    .income-input { width: 120px; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; text-align: right; font-weight: bold; }
    .stats-card { background: #fff; border-radius: 8px; padding: 12px; border: 1px solid #e5e7eb; }
    .stats-card h3 { font-size: 12px; font-weight: 700; margin-bottom: 8px; border-bottom: 1px solid #f3f4f6; padding-bottom: 4px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 4px 0; }
    .bar-container { flex: 1; height: 8px; background: #f3f4f6; border-radius: 4px; margin: 0 10px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; }

    /* 최하단 가계부 입력 영역 */
    .expense-bottom-area { flex: 0 0 auto; display: flex; align-items: center; padding: 8px 10px; background: #fff; gap: 6px; border-top: 2px solid #e5e7eb; }
    .preview-badge { background: #e0e7ff; color: #3730a3; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .price-input { flex: 1; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단 탭 전환 메뉴 -->
  <div class="app-switcher">
    <button class="switch-tab active" onclick="switchTab('schedule')">📅 일정 관리</button>
    <button class="switch-tab" onclick="switchTab('expense')">💰 가계부 지출</button>
  </div>

  <!-- 공통 상단: 달력 영역 -->
  <div class="top-calendar">
    <div class="calendar-header">
      <div class="header-left"><button class="nav-btn" onclick="moveMonth(-1)">&lt;</button></div>
      <h2 id="monthYearText"></h2>
      <div class="header-right">
        <button class="mode-btn" id="statsModeBtn" onclick="toggleStatsMode()" style="display:none;">📊 통계/수입</button>
        <button class="nav-btn" onclick="moveMonth(1)">&gt;</button>
      </div>
    </div>
    <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- 메인 컨텐츠 영역 -->
  <div class="content-section" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
    
    <!-- 1. 일정 관리 뷰 -->
    <div id="scheduleView" class="view-panel active">
      <div class="schedule-input-area">
        <button class="date-insert-btn" onclick="insertDatePrefix()">날짜삽입</button>
        <input type="text" id="scheduleInput" class="text-input" placeholder="선택한 날짜의 일정 입력..." onkeypress="if(event.key==='Enter') addSchedule()">
        <button class="action-btn" onclick="addSchedule()">일정 추가</button>
      </div>
      <div class="schedule-list-area" id="scheduleList"></div>
    </div>

    <!-- 2. 가계부 뷰 -->
    <div id="expenseView" class="view-panel">
      <!-- 중간: 세로 날짜 선택바 + 포켓몬 카테고리 클라우드 -->
      <div class="expense-middle" id="expenseInputView">
        <div class="selector-panel">
          <div class="date-col">
            <div class="col-title-area"><span class="col-title">📅 날짜</span></div>
            <div class="vertical-date-scroll" id="verticalDateList"></div>
          </div>
          <div class="category-col">
            <div class="col-title-area">
              <span class="col-title">🏷️ 항목 선택</span>
              <button class="edit-cat-btn" id="editCatBtn" onclick="toggleDeleteMode()">🗑️ 편집</button>
            </div>
            <div class="category-cloud" id="categoryCloud"></div>
          </div>
        </div>
      </div>

      <!-- 가계부 내역 피드 -->
      <div class="expense-feed-section" id="expenseFeedSection">
        <div id="feedList"></div>
      </div>

      <!-- 통계 화면 -->
      <div class="stats-view" id="statsView">
        <div class="income-box">
          <label>💰 이번 달 월 수입</label>
          <input type="number" class="income-input" id="incomeInput" placeholder="금액 입력" oninput="updateIncome(this.value)">
        </div>
        <div class="stats-card">
          <h3>📈 지출 현황 및 그래프</h3>
          <div id="statsContent"></div>
        </div>
      </div>

      <!-- 최하단 가계부 입력 영역 -->
      <div class="expense-bottom-area" id="expenseBottomArea">
        <div class="preview-badge" id="previewBadge">선택중</div>
        <input type="number" class="price-input" id="priceInput" placeholder="금액 입력" onkeypress="if(event.key==='Enter') addExpense()">
        <button class="action-btn" onclick="addExpense()">추가</button>
      </div>
    </div>

  </div>
</div>

<script>
  let currentDate = new Date();
  let selectedDate = new Date();
  let currentTab = 'schedule';

  let schedules = JSON.parse(localStorage.getItem('unified_schedules_v2')) || {};
  let expenses = JSON.parse(localStorage.getItem('unified_expenses_v2')) || {};
  let monthlyIncomes = JSON.parse(localStorage.getItem('unified_incomes_v2')) || {};
  
  const categoryColors = JSON.parse(localStorage.getItem('unified_cat_colors_v2')) || { '점심': '#2563eb', '저녁': '#059669', '커피': '#d97706', '택시': '#dc2626', '쇼핑': '#7c3aed', '기타': '#4b5563' };
  const defaultPokeIds = { '점심': 7, '저녁': 1, '커피': 4, '택시': 25, '쇼핑': 94, '기타': 133 };
  const randomPokePool = [7, 1, 4, 25, 94, 133, 39, 52, 54, 143, 151, 175];
  const weekNames = ['일', '월', '화', '수', '목', '금', '토'];
  
  let customPokeIds = JSON.parse(localStorage.getItem('unified_pokes_v2')) || defaultPokeIds;
  let customCategories = JSON.parse(localStorage.getItem('unified_cats_v2')) || ['점심', '저녁', '커피', '택시', '쇼핑', '기타'];
  let selectedCategory = customCategories[0] || '점심';
  let isStatsMode = false;

  // 카테고리 삭제 모드 상태 변수
  let isDeleteMode = false;
  let pendingDeleteCats = [];

  function formatDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function switchTab(tab) {
    currentTab = tab;
    if (isDeleteMode) exitDeleteMode();
    document.querySelectorAll('.switch-tab').forEach((el, idx) => {
      el.classList.toggle('active', (idx === 0 && tab === 'schedule') || (idx === 1 && tab === 'expense'));
    });
    document.getElementById('scheduleView').classList.toggle('active', tab === 'schedule');
    document.getElementById('expenseView').classList.toggle('active', tab === 'expense');
    document.getElementById('statsModeBtn').style.display = (tab === 'expense') ? 'inline-block' : 'none';
    if(tab === 'expense' && isStatsMode) toggleStatsMode(true);
    renderApp();
  }

  function moveMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderApp();
  }

  function renderApp() {
    renderCalendar();
    if (currentTab === 'schedule') {
      renderSchedules();
    } else {
      renderVerticalDates();
      renderCategories();
      renderExpenseFeed();
      updatePreview();
      if (isStatsMode) renderStats();
    }
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    document.getElementById('monthYearText').textContent = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const todayKey = formatDateKey(new Date());
    const selectedKey = formatDateKey(selectedDate);
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      grid.appendChild(document.createElement('div'));
    }

    for (let d = 1; d <= lastDate; d++) {
      const cellDate = new Date(year, month, d);
      const dateKey = formatDateKey(cellDate);
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (cellDate.getDay() === 0) cell.classList.add('sun');
      if (cellDate.getDay() === 6) cell.classList.add('sat');
      if (dateKey === todayKey) cell.classList.add('today');
      if (dateKey === selectedKey) cell.classList.add('selected');

      cell.innerHTML = `<span>${d}</span>`;
      
      if ((schedules[dateKey] && schedules[dateKey].length > 0) || (expenses[dateKey] && expenses[dateKey].length > 0)) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      cell.addEventListener('click', () => {
        selectedDate = new Date(cellDate);
        renderApp();
      });
      grid.appendChild(cell);
    }
  }

  // ================= 📅 일정 관리 기능 =================
  function insertDatePrefix() {
    const input = document.getElementById('scheduleInput');
    const yy = String(selectedDate.getFullYear()).slice(-2);
    const mm = String(selectedDate.getMonth() + 1).padStart(2, '0');
    const dd = String(selectedDate.getDate()).padStart(2, '0');
    input.value = `/${yy}${mm}${dd} `;
    input.focus();
  }

  function addSchedule() {
    const input = document.getElementById('scheduleInput');
    let val = input.value.trim();
    if (!val) return;

    val = val.replace(/^\/\d{6}\s*/, '').trim();
    if (!val) return;

    const key = formatDateKey(selectedDate);
    if (!schedules[key]) schedules[key] = [];
    schedules[key].push({ text: val, completed: false });
    localStorage.setItem('unified_schedules_v2', JSON.stringify(schedules));
    input.value = '';
    renderApp();
  }

  function renderSchedules() {
    const list = document.getElementById('scheduleList');
    list.innerHTML = '';
    
    const sortedKeys = Object.keys(schedules).filter(k => schedules[k]?.length > 0).sort();

    if (sortedKeys.length === 0) {
      list.innerHTML = '<div style="color:#9ca3af; font-size:12px; text-align:center; margin-top:20px;">등록된 일정이 없습니다.</div>';
      return;
    }

    sortedKeys.forEach((dateKey) => {
      const items = schedules[dateKey];
      const [y, m, d] = dateKey.split('-');
      
      const targetDateObj = new Date(y, parseInt(m) - 1, parseInt(d));
      const dayOfWeek = weekNames[targetDateObj.getDay()];

      const group = document.createElement('div');
      group.className = 'record-group';
      
      group.innerHTML = `
        <div class="record-group-title">
          <span>${y}년 ${parseInt(m)}월 ${parseInt(d)}일 (${dayOfWeek})</span>
        </div>`;

      items.forEach((item, itemIdx) => {
        const div = document.createElement('div');
        div.className = 'schedule-item';
        
        const left = document.createElement('div');
        left.className = 'schedule-left';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.completed;
        checkbox.style.cursor = 'pointer';
        checkbox.addEventListener('change', () => {
          schedules[dateKey][itemIdx].completed = checkbox.checked;
          localStorage.setItem('unified_schedules_v2', JSON.stringify(schedules));
          renderSchedules();
        });

        const span = document.createElement('span');
        span.className = 'schedule-text' + (item.completed ? ' completed' : '');
        span.textContent = item.text;
        
        span.addEventListener('click', () => {
          const nt = prompt('일정 수정:', item.text);
          if (nt !== null && nt.trim()) {
            schedules[dateKey][itemIdx].text = nt.trim();
            localStorage.setItem('unified_schedules_v2', JSON.stringify(schedules));
            renderSchedules();
          }
        });

        left.appendChild(checkbox);
        left.appendChild(span);

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.innerHTML = '&times;';
        del.addEventListener('click', () => {
          schedules[dateKey].splice(itemIdx, 1);
          if (schedules[dateKey].length === 0) delete schedules[dateKey];
          localStorage.setItem('unified_schedules_v2', JSON.stringify(schedules));
          renderApp();
        });

        div.appendChild(left);
        div.appendChild(del);
        group.appendChild(div);
      });
      list.appendChild(group);
    });
  }

  // ================= 💰 가계부 지출 및 카테고리 편집 기능 =================
  function toggleDeleteMode() {
    isDeleteMode = !isDeleteMode;
    const btn = document.getElementById('editCatBtn');
    if (isDeleteMode) {
      pendingDeleteCats = [];
      btn.textContent = '❌ 삭제 완료';
      btn.classList.add('active');
    } else {
      executeDeletions();
    }
    renderCategories();
  }

  function exitDeleteMode() {
    isDeleteMode = false;
    pendingDeleteCats = [];
    const btn = document.getElementById('editCatBtn');
    if (btn) {
      btn.textContent = '🗑️ 편집';
      btn.classList.remove('active');
    }
  }

  function executeDeletions() {
    if (pendingDeleteCats.length > 0) {
      customCategories = customCategories.filter(c => !pendingDeleteCats.includes(c));
      localStorage.setItem('unified_cats_v2', JSON.stringify(customCategories));
      if (!customCategories.includes(selectedCategory)) {
        selectedCategory = customCategories[0] || '';
      }
    }
    exitDeleteMode();
  }

  function renderVerticalDates() {
    const list = document.getElementById('verticalDateList');
    if (!list) return;
    list.innerHTML = '';
    const selectedKey = formatDateKey(selectedDate);
    let activeChip = null;

    for (let i = -15; i <= 15; i++) {
      const target = new Date(selectedDate);
      target.setDate(selectedDate.getDate() + i);
      const dateKey = formatDateKey(target);
      const chip = document.createElement('div');
      const isActive = dateKey === selectedKey;
      chip.className = 'date-chip' + (isActive ? ' active' : '');
      chip.textContent = `${target.getMonth() + 1}/${target.getDate()}`;
      chip.addEventListener('click', () => { 
        selectedDate = new Date(target); 
        renderApp(); 
      });
      list.appendChild(chip);
      if (isActive) activeChip = chip;
    }

    if (activeChip) {
      setTimeout(() => {
        list.scrollTop = activeChip.offsetTop - (list.clientHeight / 2) + (activeChip.offsetHeight / 2);
      }, 50);
    }
  }

  function renderCategories() {
    const cloud = document.getElementById('categoryCloud');
    if (!cloud) return;
    cloud.innerHTML = '';

    customCategories.forEach((cat, idx) => {
      const chip = document.createElement('div');
      let chipClass = 'cat-chip';
      const color = categoryColors[cat] || '#2563eb';

      if (isDeleteMode) {
        chipClass += ' wiggle';
        if (pendingDeleteCats.includes(cat)) {
          chipClass += ' to-delete';
        } else {
          chip.style.backgroundColor = '#ffffff';
          chip.style.color = color;
          chip.style.borderColor = color;
        }
      } else {
        if (selectedCategory === cat) {
          chip.style.backgroundColor = color;
          chip.style.color = '#ffffff';
        } else {
          chip.style.backgroundColor = '#ffffff';
          chip.style.color = color;
          chip.style.borderColor = color;
        }
      }

      chip.className = chipClass;
      chip.textContent = isDeleteMode && pendingDeleteCats.includes(cat) ? `✔ ${cat}` : cat;

      const pokeId = customPokeIds[cat] || randomPokePool[idx % randomPokePool.length];
      const pokeImg = document.createElement('img');
      pokeImg.className = 'poke-badge';
      pokeImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokeId}.png`;
      pokeImg.onerror = function() { this.style.display = 'none'; };
      chip.appendChild(pokeImg);

      chip.addEventListener('click', () => {
        if (isDeleteMode) {
          const pIdx = pendingDeleteCats.indexOf(cat);
          if (pIdx > -1) {
            pendingDeleteCats.splice(pIdx, 1);
          } else {
            pendingDeleteCats.push(cat);
          }
          renderCategories();
        } else {
          selectedCategory = cat;
          renderApp();
        }
      });

      cloud.appendChild(chip);
    });

    if (!isDeleteMode) {
      const addBtn = document.createElement('button');
      addBtn.className = 'cat-add-btn';
      addBtn.textContent = '+ 추가';
      addBtn.addEventListener('click', () => {
        const newCat = prompt('새 지출 항목 이름:');
        if (newCat && newCat.trim() && !customCategories.includes(newCat.trim())) {
          const trimmed = newCat.trim();
          customCategories.push(trimmed);
          const colors = ['#2563eb', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0284c7', '#db2777'];
          categoryColors[trimmed] = colors[Math.floor(Math.random() * colors.length)];
          customPokeIds[trimmed] = randomPokePool[Math.floor(Math.random() * randomPokePool.length)];
          localStorage.setItem('unified_cats_v2', JSON.stringify(customCategories));
          localStorage.setItem('unified_pokes_v2', JSON.stringify(customPokeIds));
          localStorage.setItem('unified_cat_colors_v2', JSON.stringify(categoryColors));
          selectedCategory = trimmed;
          renderApp();
        }
      });
      cloud.appendChild(addBtn);
    }
  }

  function updatePreview() {
    const badge = document.getElementById('previewBadge');
    if (badge) {
      badge.textContent = `${selectedDate.getMonth() + 1}/${selectedDate.getDate()} [${selectedCategory}]`;
    }
  }

  function addExpense() {
    const input = document.getElementById('priceInput');
    const val = input.value.trim();
    if (!val) return;
    const dateKey = formatDateKey(selectedDate);
    if (!expenses[dateKey]) expenses[dateKey] = [];
    expenses[dateKey].push({ category: selectedCategory, price: parseInt(val) });
    localStorage.setItem('unified_expenses_v2', JSON.stringify(expenses));
    input.value = '';
    renderApp();
  }

  function renderExpenseFeed() {
    const feedList = document.getElementById('feedList');
    if (!feedList) return;
    feedList.innerHTML = '';
    const sortedKeys = Object.keys(expenses).filter(k => expenses[k]?.length > 0).sort();

    if (sortedKeys.length === 0) {
      feedList.innerHTML = '<div style="text-align:center; color:#9ca3af; font-size:12px; margin-top:20px;">기록된 지출이 없습니다.</div>';
      return;
    }

    sortedKeys.forEach(dateKey => {
      const items = expenses[dateKey];
      const [y, m, d] = dateKey.split('-');
      const targetDateObj = new Date(y, parseInt(m) - 1, parseInt(d));
      const dayOfWeek = weekNames[targetDateObj.getDay()];

      const group = document.createElement('div');
      group.className = 'record-group';
      group.innerHTML = `<div class="record-group-title"><span>${y}년 ${parseInt(m)}월 ${parseInt(d)}일 (${dayOfWeek})</span></div>`;

      items.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'record-item';
        const color = categoryColors[item.category] || '#2563eb';
        
        const info = document.createElement('div');
        info.className = 'record-info';
        info.innerHTML = `<span class="badge" style="background-color: ${color};">${item.category}</span><span class="price">${Number(item.price).toLocaleString()}원</span>`;
        info.addEventListener('click', () => {
          const np = prompt('금액 수정:', item.price);
          if (np !== null && !isNaN(parseInt(np))) {
            expenses[dateKey][index].price = parseInt(np);
            localStorage.setItem('unified_expenses_v2', JSON.stringify(expenses));
            renderApp();
          }
        });

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.innerHTML = '&times;';
        del.addEventListener('click', () => {
          expenses[dateKey].splice(index, 1);
          if (expenses[dateKey].length === 0) delete expenses[dateKey];
          localStorage.setItem('unified_expenses_v2', JSON.stringify(expenses));
          renderApp();
        });

        itemDiv.appendChild(info);
        itemDiv.appendChild(del);
        group.appendChild(itemDiv);
      });
      feedList.appendChild(group);
    });
  }

  // ================= 📊 통계 및 월 수입 기능 =================
  function toggleStatsMode(forceState) {
    isStatsMode = forceState !== undefined ? forceState : !isStatsMode;
    document.getElementById('expenseInputView').style.display = isStatsMode ? 'none' : 'flex';
    document.getElementById('expenseFeedSection').style.display = isStatsMode ? 'none' : 'block';
    document.getElementById('statsView').style.display = isStatsMode ? 'block' : 'none';
    document.getElementById('expenseBottomArea').style.display = isStatsMode ? 'none' : 'flex';
    document.getElementById('statsModeBtn').textContent = isStatsMode ? '📝 기록하기' : '📊 통계/수입';
    if (isStatsMode) renderStats();
  }

  function updateIncome(val) {
    const monthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
    const num = parseInt(val);
    if (!isNaN(num)) monthlyIncomes[monthKey] = num; else delete monthlyIncomes[monthKey];
    localStorage.setItem('unified_incomes_v2', JSON.stringify(monthlyIncomes));
    renderStats();
  }

  function renderStats() {
    const monthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
    const incomeInput = document.getElementById('incomeInput');
    if (incomeInput) incomeInput.value = monthlyIncomes[monthKey] || '';

    let catTotals = {};
    let totalExpense = 0;
    Object.keys(expenses).forEach(dateKey => {
      if (dateKey.startsWith(monthKey)) {
        expenses[dateKey].forEach(item => {
          catTotals[item.category] = (catTotals[item.category] || 0) + item.price;
          totalExpense += item.price;
        });
      }
    });

    const income = monthlyIncomes[monthKey] || 0;
    const balance = income - totalExpense;
    let html = `<div class="stat-row" style="font-weight:700; margin-bottom:6px;"><span>총 수입: ${income.toLocaleString()}원</span><span style="color:#dc2626;">지출: ${totalExpense.toLocaleString()}원</span></div>`;
    html += `<div class="stat-row" style="font-weight:700; margin-bottom:10px; color:${balance >= 0 ? '#2563eb' : '#dc2626'};"><span>잔액: ${balance.toLocaleString()}원</span></div>`;

    if (Object.keys(catTotals).length === 0) {
      html += '<div style="text-align:center; color:#9ca3af; font-size:11px; padding:10px;">이번 달 내역이 없습니다.</div>';
    } else {
      Object.keys(catTotals).forEach(cat => {
        const amt = catTotals[cat];
        const pct = totalExpense > 0 ? Math.round((amt / totalExpense) * 100) : 0;
        const color = categoryColors[cat] || '#2563eb';
        html += `<div style="margin-bottom:6px;"><div class="stat-row"><span>${cat}</span><span>${amt.toLocaleString()}원 (${pct}%)</span></div><div class="bar-container"><div class="bar-fill" style="width: ${pct}%; background-color: ${color};"></div></div></div>`;
      });
    }
    const statsContent = document.getElementById('statsContent');
    if (statsContent) statsContent.innerHTML = html;
  }

  renderApp();
</script>
