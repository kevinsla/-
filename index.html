<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="일정 및 가계부">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="일정 및 가계부">
  <title>일정 및 가계부 통합 앱</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; color: #1f2937; }
    .app-container { display: flex; flex-direction: column; height: 100dvh; max-width: 800px; margin: 0 auto; background-color: #ffffff; }

    /* 상단 네비게이션 탭 (일정 vs 가계부 전환) */
    .app-switcher { display: flex; background: #2563eb; padding: 6px; gap: 6px; }
    .switch-tab { flex: 1; background: rgba(255,255,255,0.2); border: none; border-radius: 4px; padding: 6px; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; }
    .switch-tab.active { background: #fff; color: #2563eb; }

    /* 상단: 달력 영역 */
    .top-calendar { flex: 0 0 25%; display: flex; flex-direction: column; justify-content: center; border-bottom: 2px solid #e5e7eb; background: #fff; padding: 4px 10px; }
    .calendar-header { position: relative; display: flex; justify-content: space-between; align-items: center; height: 24px; margin-bottom: 2px; }
    .calendar-header h2 { position: absolute; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 700; white-space: nowrap; pointer-events: none; }
    .header-left, .header-right { display: flex; gap: 4px; align-items: center; z-index: 1; }
    .nav-btn { background: #f3f4f6; border: none; border-radius: 4px; padding: 3px 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 9px; font-weight: 600; color: #6b7280; margin-bottom: 1px; }
    .weekdays div:first-child { color: #ef4444; }
    .weekdays div:last-child { color: #3b82f6; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .day-cell { aspect-ratio: 2.6; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; border-radius: 3px; cursor: pointer; background-color: #f9fafb; position: relative; }
    .day-cell.sun { color: #ef4444; }
    .day-cell.sat { color: #3b82f6; }
    .day-cell.today { font-weight: 800; background-color: #eff6ff; color: #2563eb; }
    .day-cell.selected { background-color: #2563eb; color: #ffffff !important; font-weight: 700; }
    .dot { width: 4px; height: 4px; background-color: #10b981; border-radius: 50%; position: absolute; bottom: 2px; }

    /* 컨텐츠 영역 */
    .content-section { flex: 1; background-color: #fafafa; display: flex; flex-direction: column; overflow: hidden; padding: 8px; }
    .view-panel { display: none; flex-direction: column; height: 100%; overflow-y: auto; }
    .view-panel.active { display: flex; }

    /* 공통 입력/리스트 스타일 */
    .input-box { display: flex; gap: 6px; margin-bottom: 8px; }
    .text-input, .price-input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; }
    .action-btn { background-color: #2563eb; color: white; border: none; border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    
    .list-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .card-item { background: #fff; padding: 8px 10px; border-radius: 6px; border: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .delete-btn { background: none; border: none; color: #d1d5db; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단 탭 전환 -->
  <div class="app-switcher">
    <button class="switch-tab active" onclick="switchTab('schedule')">📅 일정 관리</button>
    <button class="switch-tab" onclick="switchTab('expense')">💰 가계부 지출</button>
  </div>

  <!-- 달력 영역 -->
  <div class="top-calendar">
    <div class="calendar-header">
      <div class="header-left"><button class="nav-btn" onclick="moveMonth(-1)">&lt;</button></div>
      <h2 id="monthYearText"></h2>
      <div class="header-right"><button class="nav-btn" onclick="moveMonth(1)">&gt;</button></div>
    </div>
    <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- 메인 컨텐츠 영역 -->
  <div class="content-section">
    
    <!-- 1. 일정 뷰 -->
    <div id="scheduleView" class="view-panel active">
      <div class="input-box">
        <input type="text" id="scheduleInput" class="text-input" placeholder="선택한 날짜의 일정 입력...">
        <button class="action-btn" onclick="addSchedule()">일정 추가</button>
      </div>
      <div class="list-area" id="scheduleList"></div>
    </div>

    <!-- 2. 가계부 뷰 -->
    <div id="expenseView" class="view-panel">
      <div class="input-box">
        <select id="expenseCategory" class="text-input" style="flex: 0 0 90px;">
          <option value="점심">점심</option>
          <option value="저녁">저녁</option>
          <option value="커피">커피</option>
          <option value="택시">택시</option>
          <option value="쇼핑">쇼핑</option>
          <option value="기타">기타</option>
        </select>
        <input type="number" id="expensePrice" class="price-input" placeholder="금액 입력">
        <button class="action-btn" onclick="addExpense()">지출 추가</button>
      </div>
      <div class="list-area" id="expenseList"></div>
    </div>

  </div>
</div>

<script>
  let currentDate = new Date();
  let selectedDate = new Date();
  let currentTab = 'schedule';

  let schedules = JSON.parse(localStorage.getItem('unified_schedules')) || {};
  let expenses = JSON.parse(localStorage.getItem('unified_expenses')) || {};

  function formatDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.switch-tab').forEach((el, idx) => {
      el.classList.toggle('active', (idx === 0 && tab === 'schedule') || (idx === 1 && tab === 'expense'));
    });
    document.getElementById('scheduleView').classList.toggle('active', tab === 'schedule');
    document.getElementById('expenseView').classList.toggle('active', tab === 'expense');
  }

  function moveMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    document.getElementById('monthYearText').textContent = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const todayKey = formatDateKey(new Date());
    const selectedKey = formatDateKey(selectedDate);
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      grid.appendChild(document.createElement('div'));
    }

    for (let d = 1; d <= lastDate; d++) {
      const cellDate = new Date(year, month, d);
      const dateKey = formatDateKey(cellDate);
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (cellDate.getDay() === 0) cell.classList.add('sun');
      if (cellDate.getDay() === 6) cell.classList.add('sat');
      if (dateKey === todayKey) cell.classList.add('today');
      if (dateKey === selectedKey) cell.classList.add('selected');

      cell.innerHTML = `<span>${d}</span>`;
      
      // 일정이 있거나 지출이 있으면 초록색 점 표시
      if ((schedules[dateKey] && schedules[dateKey].length > 0) || (expenses[dateKey] && expenses[dateKey].length > 0)) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      cell.addEventListener('click', () => {
        selectedDate = new Date(cellDate);
        renderCalendar();
        renderLists();
      });
      grid.appendChild(cell);
    }
  }

  function addSchedule() {
    const input = document.getElementById('scheduleInput');
    const val = input.value.trim();
    if (!val) return;
    const key = formatDateKey(selectedDate);
    if (!schedules[key]) schedules[key] = [];
    schedules[key].push(val);
    localStorage.setItem('unified_schedules', JSON.stringify(schedules));
    input.value = '';
    renderCalendar();
    renderLists();
  }

  function addExpense() {
    const cat = document.getElementById('expenseCategory').value;
    const priceInput = document.getElementById('expensePrice');
    const val = parseInt(priceInput.value);
    if (isNaN(val)) return;
    const key = formatDateKey(selectedDate);
    if (!expenses[key]) expenses[key] = [];
    expenses[key].push({ category: cat, price: val });
    localStorage.setItem('unified_expenses', JSON.stringify(expenses));
    priceInput.value = '';
    renderCalendar();
    renderLists();
  }

  function renderLists() {
    const key = formatDateKey(selectedDate);
    
    // 일정 리스트 렌더링
    const schList = document.getElementById('scheduleList');
    schList.innerHTML = '';
    const schs = schedules[key] || [];
    if (schs.length === 0) {
      schList.innerHTML = '<div style="color:#9ca3af; font-size:11px; text-align:center; margin-top:10px;">등록된 일정이 없습니다.</div>';
    } else {
      schs.forEach((item, idx) => {
        schList.innerHTML += `<div class="card-item"><span>📌 ${item}</span><button class="delete-btn" onclick="delSchedule('${key}', ${idx})">&times;</button></div>`;
      });
    }

    // 가계부 리스트 렌더링
    const expList = document.getElementById('expenseList');
    expList.innerHTML = '';
    const exps = expenses[key] || [];
    if (exps.length === 0) {
      expList.innerHTML = '<div style="color:#9ca3af; font-size:11px; text-align:center; margin-top:10px;">기록된 지출이 없습니다.</div>';
    } else {
      exps.forEach((item, idx) => {
        expList.innerHTML += `<div class="card-item"><span>[${item.category}] ${item.price.toLocaleString()}원</span><button class="delete-btn" onclick="delExpense('${key}', ${idx})">&times;</button></div>`;
      });
    }
  }

  function delSchedule(key, idx) {
    schedules[key].splice(idx, 1);
    if (schedules[key].length === 0) delete schedules[key];
    localStorage.setItem('unified_schedules', JSON.stringify(schedules));
    renderCalendar();
    renderLists();
  }

  function delExpense(key, idx) {
    expenses[key].splice(idx, 1);
    if (expenses[key].length === 0) delete expenses[key];
    localStorage.setItem('unified_expenses', JSON.stringify(expenses));
    renderCalendar();
    renderLists();
  }

  renderCalendar();
  renderLists();
</script>

</body>
</html>
