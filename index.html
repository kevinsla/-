<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>나만의 일정 위젯</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #ffffff;
      color: #1f2937;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
    }

    /* 상단: 위젯형 달력 영역 */
    .top-section {
      display: flex;
      flex-direction: column;
      border-bottom: 2px solid #e5e7eb;
      background-color: #ffffff;
      padding: 8px 12px 6px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .calendar-header h2 {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }

    .nav-btn {
      background: #f3f4f6;
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: bold;
      color: #374151;
      cursor: pointer;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 2px;
    }

    .weekdays div:first-child { color: #ef4444; }
    .weekdays div:last-child { color: #3b82f6; }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .day-cell {
      aspect-ratio: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      background-color: #f9fafb;
    }

    .day-cell.empty {
      background: transparent;
      cursor: default;
    }

    .day-cell.sun { color: #ef4444; }
    .day-cell.sat { color: #3b82f6; }

    .day-cell.today {
      font-weight: 800;
      background-color: #eff6ff;
      color: #2563eb;
    }

    .day-cell.selected {
      background-color: #2563eb;
      color: #ffffff !important;
      font-weight: 700;
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background-color: #2563eb;
      margin-top: 1px;
    }

    .day-cell.selected .dot {
      background-color: #ffffff;
    }

    /* 하단: 누적 일정 피드 영역 */
    .feed-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #fafafa;
      overflow: hidden;
    }

    .feed-header {
      padding: 8px 12px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .feed-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .empty-msg {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 20px;
    }

    .date-group {
      margin-bottom: 8px;
      background: #ffffff;
      border-radius: 6px;
      padding: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      border: 1px solid #f0f0f0;
    }

    .date-group-title {
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 4px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 2px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 4px 0;
    }

    .todo-checkbox {
      width: 16px;
      height: 16px;
      margin-right: 6px;
      accent-color: #2563eb;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 13px;
      color: #1f2937;
      word-break: break-all;
      cursor: pointer;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .edit-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      margin-right: 4px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 14px;
      padding: 0 4px;
      cursor: pointer;
    }

    .delete-btn:active {
      color: #ef4444;
    }

    /* 일정 입력창 */
    .input-area {
      display: flex;
      padding: 8px 12px;
      background-color: #ffffff;
      border-top: 1px solid #e5e7eb;
      gap: 6px;
    }

    .todo-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .todo-input:focus {
      border-color: #2563eb;
    }

    .add-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단: 위젯형 달력 -->
  <div class="top-section">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth">&lt;</button>
      <h2 id="monthYearText"></h2>
      <button class="nav-btn" id="nextMonth">&gt;</button>
    </div>
    <div class="weekdays">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- 하단: 일정이 있는 날만 누적 표시되는 피드 -->
  <div class="feed-section">
    <div class="feed-header">
      <span id="feedTitle">등록된 전체 일정 (누적)</span>
      <span id="selectedIndicator" style="font-size: 11px; color: #2563eb; font-weight: normal;">오늘 선택됨</span>
    </div>
    <div class="feed-list" id="feedList"></div>
    
    <div class="input-area">
      <input type="text" class="todo-input" id="todoInput" placeholder="선택한 날짜에 새 일정 추가...">
      <button class="add-btn" id="addBtn">추가</button>
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => {
        e.waitUntil(caches.open('pwa-v2').then(cache => cache.addAll(['./'])));
      });
      self.addEventListener('fetch', e => {
        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
      });
    `;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }

  const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
  let currentDate = new Date();
  let selectedDate = new Date();

  let schedules = JSON.parse(localStorage.getItem('my_schedule_app_v1')) || {};

  function saveSchedules() {
    localStorage.setItem('my_schedule_app_v1', JSON.stringify(schedules));
  }

  function formatDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    document.getElementById('monthYearText').textContent = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const todayKey = formatDateKey(new Date());
    const selectedKey = formatDateKey(selectedDate);

    const daysGrid = document.getElementById('daysGrid');
    daysGrid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell empty';
      daysGrid.appendChild(emptyCell);
    }

    for (let d = 1; d <= lastDate; d++) {
      const cellDate = new Date(year, month, d);
      const dateKey = formatDateKey(cellDate);
      const dayOfWeek = cellDate.getDay();

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dayOfWeek === 0) cell.classList.add('sun');
      if (dayOfWeek === 6) cell.classList.add('sat');
      if (dateKey === todayKey) cell.classList.add('today');
      if (dateKey === selectedKey) cell.classList.add('selected');

      const numSpan = document.createElement('span');
      numSpan.textContent = d;
      cell.appendChild(numSpan);

      if (schedules[dateKey] && schedules[dateKey].length > 0) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      cell.addEventListener('click', () => {
        selectedDate = cellDate;
        renderCalendar();
        renderFeed();
        updateIndicator();
      });

      daysGrid.appendChild(cell);
    }
  }

  function updateIndicator() {
    const y = selectedDate.getFullYear();
    const m = selectedDate.getMonth() + 1;
    const d = selectedDate.getDate();
    const dayName = dayNames[selectedDate.getDay()];
    document.getElementById('selectedIndicator').textContent = `[선택: ${y}.${m}.${d} (${dayName})]`;
    document.getElementById('todoInput').placeholder = `${m}월 ${d}일 새 일정 입력...`;
  }

  function renderFeed() {
    const feedList = document.getElementById('feedList');
    feedList.innerHTML = '';

    const sortedKeys = Object.keys(schedules).filter(key => schedules[key] && schedules[key].length > 0).sort();

    if (sortedKeys.length === 0) {
      feedList.innerHTML = '<div class="empty-msg">등록된 일정이 없습니다.<br>달력에서 날짜를 선택하고 일정을 추가해 보세요!</div>';
      return;
    }

    sortedKeys.forEach(dateKey => {
      const items = schedules[dateKey];
      if (items.length === 0) return;

      const [y, m, d] = dateKey.split('-');
      const targetDate = new Date(y, m - 1, d);
      const dayName = dayNames[targetDate.getDay()];

      const groupDiv = document.createElement('div');
      groupDiv.className = 'date-group';

      const titleDiv = document.createElement('div');
      titleDiv.className = 'date-group-title';
      titleDiv.textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일 (${dayName})`;
      groupDiv.appendChild(titleDiv);

      items.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'todo-item' + (item.done ? ' completed' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'todo-checkbox';
        checkbox.checked = item.done;
        checkbox.addEventListener('change', () => {
          schedules[dateKey][index].done = checkbox.checked;
          saveSchedules();
          renderFeed();
        });

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = item.text;
        
        // 텍스트를 누르면 수정할 수 있도록 기능 추가
        span.addEventListener('click', () => {
          const newText = prompt('일정 수정:', item.text);
          if (newText !== null) {
            const trimmed = newText.trim();
            if (trimmed !== '') {
              schedules[dateKey][index].text = trimmed;
              saveSchedules();
              renderFeed();
            }
          }
        });

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = '수정';
        editBtn.addEventListener('click', () => {
          const newText = prompt('일정 수정:', item.text);
          if (newText !== null) {
            const trimmed = newText.trim();
            if (trimmed !== '') {
              schedules[dateKey][index].text = trimmed;
              saveSchedules();
              renderFeed();
            }
          }
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '&times;';
        delBtn.addEventListener('click', () => {
          schedules[dateKey].splice(index, 1);
          if (schedules[dateKey].length === 0) {
            delete schedules[dateKey];
          }
          saveSchedules();
          renderCalendar();
          renderFeed();
        });

        itemDiv.appendChild(checkbox);
        itemDiv.appendChild(span);
        itemDiv.appendChild(editBtn);
        itemDiv.appendChild(delBtn);
        groupDiv.appendChild(itemDiv);
      });

      feedList.appendChild(groupDiv);
    });
  }

  function addTodo() {
    const input = document.getElementById('todoInput');
    const text = input.value.trim();
    if (!text) return;

    const dateKey = formatDateKey(selectedDate);
    if (!schedules[dateKey]) {
      schedules[dateKey] = [];
    }

    schedules[dateKey].push({ text: text, done: false });
    saveSchedules();
    input.value = '';
    renderCalendar();
    renderFeed();
  }

  document.getElementById('addBtn').addEventListener('click', addTodo);
  document.getElementById('todoInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addTodo();
  });

  document.getElementById('prevMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  renderCalendar();
  renderFeed();
  updateIndicator();
</script>

</body>
</html>
