<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>나만의 일정 노트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #f4f5f7;
      color: #1f2937;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }

    /* 상단 1/3: 달력 영역 */
    .calendar-section {
      height: 36%;
      min-height: 230px;
      padding: 12px 16px 8px;
      border-bottom: 2px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .calendar-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }

    .nav-btn {
      background: #f3f4f6;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      cursor: pointer;
    }

    .nav-btn:active {
      background: #e5e7eb;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .weekdays div:first-child { color: #ef4444; }
    .weekdays div:last-child { color: #3b82f6; }

    .days-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 1fr;
      gap: 2px;
    }

    .day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }

    .day-cell.empty {
      cursor: default;
    }

    .day-cell.sun { color: #ef4444; }
    .day-cell.sat { color: #3b82f6; }

    .day-cell.today {
      font-weight: 800;
      background-color: #eff6ff;
      color: #2563eb;
    }

    .day-cell.selected {
      background-color: #2563eb;
      color: #ffffff !important;
      font-weight: 700;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #2563eb;
      margin-top: 2px;
    }

    .day-cell.selected .dot {
      background-color: #ffffff;
    }

    /* 하단 2/3: 노트 일정 영역 */
    .note-section {
      height: 64%;
      display: flex;
      flex-direction: column;
      background-color: #fafafa;
    }

    .note-header {
      padding: 14px 18px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-date-title {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }

    .todo-count {
      font-size: 12px;
      color: #6b7280;
      background: #f3f4f6;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .todo-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 18px;
      list-style: none;
    }

    .empty-msg {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-top: 40px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      border: 1px solid #f0f0f0;
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      accent-color: #2563eb;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
      color: #1f2937;
      transition: all 0.15s ease;
    }

    /* 완료 시 중간 실선 처리 */
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      text-decoration-color: #6b7280;
      color: #9ca3af;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 18px;
      padding: 0 4px;
      margin-left: 8px;
      cursor: pointer;
    }

    .delete-btn:active {
      color: #ef4444;
    }

    /* 하단 일정 입력창 */
    .input-area {
      display: flex;
      padding: 10px 14px;
      background-color: #ffffff;
      border-top: 1px solid #e5e7eb;
      gap: 8px;
    }

    .todo-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .todo-input:focus {
      border-color: #2563eb;
    }

    .add-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-btn:active {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단 1/3: 달력 -->
  <div class="calendar-section">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth">&lt;</button>
      <h2 id="monthYearText"></h2>
      <button class="nav-btn" id="nextMonth">&gt;</button>
    </div>
    <div class="weekdays">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- 하단 2/3: 노트 일정 -->
  <div class="note-section">
    <div class="note-header">
      <div class="note-date-title" id="selectedDateTitle"></div>
      <div class="todo-count" id="todoCount">0개</div>
    </div>
    <ul class="todo-list" id="todoList"></ul>
    <div class="input-area">
      <input type="text" class="todo-input" id="todoInput" placeholder="새로운 일정을 입력하세요...">
      <button class="add-btn" id="addBtn">추가</button>
    </div>
  </div>
</div>

<script>
  const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
  let currentDate = new Date();
  let selectedDate = new Date();

  // 로컬 스토리지에서 데이터 불러오기
  let schedules = JSON.parse(localStorage.getItem('my_schedule_app_v1')) || {};

  function saveSchedules() {
    localStorage.setItem('my_schedule_app_v1', JSON.stringify(schedules));
  }

  function formatDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    document.getElementById('monthYearText').textContent = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const todayKey = formatDateKey(new Date());
    const selectedKey = formatDateKey(selectedDate);

    const daysGrid = document.getElementById('daysGrid');
    daysGrid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell empty';
      daysGrid.appendChild(emptyCell);
    }

    for (let d = 1; d <= lastDate; d++) {
      const cellDate = new Date(year, month, d);
      const dateKey = formatDateKey(cellDate);
      const dayOfWeek = cellDate.getDay();

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dayOfWeek === 0) cell.classList.add('sun');
      if (dayOfWeek === 6) cell.classList.add('sat');
      if (dateKey === todayKey) cell.classList.add('today');
      if (dateKey === selectedKey) cell.classList.add('selected');

      const numSpan = document.createElement('span');
      numSpan.textContent = d;
      cell.appendChild(numSpan);

      // 해당 날짜에 일정이 있으면 점 표시
      if (schedules[dateKey] && schedules[dateKey].length > 0) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      cell.addEventListener('click', () => {
        selectedDate = cellDate;
        renderCalendar();
        renderNote();
      });

      daysGrid.appendChild(cell);
    }
  }

  function renderNote() {
    const y = selectedDate.getFullYear();
    const m = selectedDate.getMonth() + 1;
    const d = selectedDate.getDate();
    const dayName = dayNames[selectedDate.getDay()];

    document.getElementById('selectedDateTitle').textContent = `${y}년 ${m}월 ${d}일 ${dayName}`;

    const dateKey = formatDateKey(selectedDate);
    const items = schedules[dateKey] || [];
    const todoList = document.getElementById('todoList');
    todoList.innerHTML = '';

    const completedCount = items.filter(item => item.done).length;
    document.getElementById('todoCount').textContent = `${completedCount} / ${items.length}`;

    if (items.length === 0) {
      todoList.innerHTML = '<div class="empty-msg">등록된 일정이 없습니다.<br>아래에서 새 일정을 추가해 보세요.</div>';
      return;
    }

    items.forEach((item, index) => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (item.done ? ' completed' : '');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'todo-checkbox';
      checkbox.checked = item.done;
      checkbox.addEventListener('change', () => {
        schedules[dateKey][index].done = checkbox.checked;
        saveSchedules();
        renderNote();
      });

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = item.text;
      // 글자를 눌러도 체크 토글되도록 편의성 추가
      span.addEventListener('click', () => {
        schedules[dateKey][index].done = !schedules[dateKey][index].done;
        saveSchedules();
        renderNote();
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerHTML = '&times;';
      delBtn.addEventListener('click', () => {
        schedules[dateKey].splice(index, 1);
        if (schedules[dateKey].length === 0) {
          delete schedules[dateKey];
        }
        saveSchedules();
        renderCalendar();
        renderNote();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      todoList.appendChild(li);
    });
  }

  function addTodo() {
    const input = document.getElementById('todoInput');
    const text = input.value.trim();
    if (!text) return;

    const dateKey = formatDateKey(selectedDate);
    if (!schedules[dateKey]) {
      schedules[dateKey] = [];
    }

    schedules[dateKey].push({ text: text, done: false });
    saveSchedules();
    input.value = '';
    renderCalendar();
    renderNote();
  }

  document.getElementById('addBtn').addEventListener('click', addTodo);
  document.getElementById('todoInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addTodo();
  });

  document.getElementById('prevMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  // 초기 실행
  renderCalendar();
  renderNote();
</script>

</body>
</html>
