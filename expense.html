<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>모바일 지출 기록기</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #ffffff;
      color: #1f2937;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
    }

    /* 1. 최상단: 달력 영역 + 전환 버튼 */
    .top-calendar {
      flex: 0 0 auto;
      border-bottom: 2px solid #e5e7eb;
      background-color: #ffffff;
      padding: 6px 10px 4px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .calendar-header h2 {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
    }

    .header-right {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .nav-btn, .mode-btn {
      background: #f3f4f6;
      border: none;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
      font-weight: bold;
      color: #374151;
      cursor: pointer;
    }

    .mode-btn {
      background-color: #eff6ff;
      color: #2563eb;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 9px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 1px;
    }

    .weekdays div:first-child { color: #ef4444; }
    .weekdays div:last-child { color: #3b82f6; }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
    }

    .day-cell {
      aspect-ratio: 2.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
      background-color: #f9fafb;
    }

    .day-cell.empty { background: transparent; cursor: default; }
    .day-cell.sun { color: #ef4444; }
    .day-cell.sat { color: #3b82f6; }
    .day-cell.today { font-weight: 800; background-color: #eff6ff; color: #2563eb; }
    .day-cell.selected { background-color: #2563eb; color: #ffffff !important; font-weight: 700; }

    /* 2. 중간: 메인 입력 화면 (좌우 분할) */
    .middle-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #fafafa;
      overflow: hidden;
    }

    .selector-panel {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px;
      gap: 8px;
      max-height: 150px;
    }

    /* 왼쪽: 세로 날짜 선택 */
    .date-col {
      flex: 0 0 95px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-right: 1px solid #f0f0f0;
      padding-right: 6px;
      overflow-y: auto;
    }

    .col-title {
      font-size: 11px;
      font-weight: 700;
      color: #4b5563;
      margin-bottom: 2px;
    }

    .date-chip {
      padding: 6px 4px;
      font-size: 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background-color: #ffffff;
      color: #374151;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
    }

    .date-chip.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    /* 오른쪽: 자유로운 배치 항목 선택 */
    .category-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .category-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-content: flex-start;
    }

    .cat-chip {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.1s;
    }

    .cat-add-btn {
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 14px;
      border: 1px dashed #9ca3af;
      background: #ffffff;
      color: #6b7280;
      cursor: pointer;
      font-weight: 600;
    }

    /* 하단 피드 목록 */
    .feed-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .empty-msg {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 15px;
    }

    .record-group {
      margin-bottom: 6px;
      background: #ffffff;
      border-radius: 6px;
      padding: 6px 10px;
      border: 1px solid #f0f0f0;
    }

    .record-group-title {
      font-size: 11px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 2px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 2px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 12px;
    }

    .record-info {
      display: flex;
      gap: 8px;
      align-items: center;
      cursor: pointer;
      flex: 1;
    }

    .badge {
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      color: #ffffff;
    }

    .price {
      font-weight: 700;
      color: #111827;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 14px;
      padding: 0 4px;
      cursor: pointer;
    }
    .delete-btn:active { color: #ef4444; }

    /* 통계 및 수입 화면 뷰 스타일 */
    .stats-view {
      flex: 1;
      background-color: #fafafa;
      overflow-y: auto;
      padding: 12px;
      display: none;
    }

    .income-box {
      background: #ffffff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .income-box label {
      font-size: 12px;
      font-weight: 700;
      color: #374151;
    }

    .income-input {
      width: 120px;
      padding: 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      text-align: right;
      font-weight: bold;
    }

    .stats-card {
      background: #ffffff;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      margin-bottom: 8px;
    }

    .stats-card h3 {
      font-size: 12px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 4px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      padding: 4px 0;
    }

    .bar-container {
      flex: 1;
      height: 8px;
      background: #f3f4f6;
      border-radius: 4px;
      margin: 0 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
    }

    /* 3. 최하단: 입력 영역 */
    .bottom-input-area {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background-color: #ffffff;
      border-top: 2px solid #e5e7eb;
      gap: 6px;
    }

    .preview-badge {
      background: #e0e7ff;
      color: #3730a3;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .price-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .price-input:focus { border-color: #2563eb; }

    .add-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- 1. 최상단: 달력 및 전환 버튼 -->
  <div class="top-calendar">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth">&lt;</
