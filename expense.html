<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>모바일 지출 기록기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; color: #1f2937; }
    .app-container { display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; background-color: #ffffff; }

    /* 1. 최상단 (1/4): 달력 영역 (가운데 정렬 및 여백 확보) */
    .top-calendar { flex: 0 0 25%; display: flex; flex-direction: column; justify-content: center; border-bottom: 2px solid #e5e7eb; background: #fff; padding: 4px 10px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .calendar-header h2 { font-size: 13px; font-weight: 700; }
    .header-right { display: flex; gap: 4px; align-items: center; }
    .nav-btn, .mode-btn { background: #f3f4f6; border: none; border-radius: 4px; padding: 3px 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .mode-btn { background-color: #eff6ff; color: #2563eb; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 9px; font-weight: 600; color: #6b7280; margin-bottom: 1px; }
    .weekdays div:first-child { color: #ef4444; }
    .weekdays div:last-child { color: #3b82f6; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .day-cell { aspect-ratio: 2.5; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; border-radius: 3px; cursor: pointer; background-color: #f9fafb; }
    .day-cell.sun { color: #ef4444; }
    .day-cell.sat { color: #3b82f6; }
    .day-cell.today { font-weight: 800; background-color: #eff6ff; color: #2563eb; }
    .day-cell.selected { background-color: #2563eb; color: #ffffff !important; font-weight: 700; }

    /* 2. 중간 (2/4): 선택 영역이 화면의 절반을 차지하도록 확장 */
    .middle-section { flex: 0 0 50%; display: flex; flex-direction: column; background-color: #fafafa; overflow: hidden; border-bottom: 2px solid #e5e7eb; }
    .selector-panel { display: flex; background-color: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 8px; gap: 8px; height: 50%; }
    
    .date-col { flex: 0 0 90px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid #f0f0f0; padding-right: 6px; overflow-y: auto; height: 100%; }
    .col-title { font-size: 11px; font-weight: 700; color: #4b5563; margin-bottom: 2px; }
    .date-chip { padding: 8px 4px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; text-align: center; cursor: pointer; font-weight: 600; flex-shrink: 0; }
    .date-chip.active { background-color: #2563eb; color: #ffffff; border-color: #2563eb; }

    .category-col { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; height: 100%; }
    .category-cloud { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
    .cat-chip { padding: 6px 12px; font-size: 11px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; font-weight: 600; }
    .cat-add-btn { padding: 6px 10px; font-size: 11px; border-radius: 14px; border: 1px dashed #9ca3af; background: #fff; color: #6b7280; cursor: pointer; font-weight: 600; }

    .feed-list { flex: 1; overflow-y: auto; padding: 8px; background: #fafafa; }
    .empty-msg { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 15px; }
    .record-group { margin-bottom: 6px; background: #fff; border-radius: 6px; padding: 6px 10px; border: 1px solid #f0f0f0; }
    .record-group-title { font-size: 11px; font-weight: 700; color: #2563eb; margin-bottom: 2px; border-bottom: 1px solid #f3f4f6; padding-bottom: 2px; }
    .record-item { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; font-size: 12px; }
    .record-info { display: flex; gap: 8px; align-items: center; cursor: pointer; flex: 1; }
    .badge { padding: 1px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; color: #fff; }
    .price { font-weight: 700; color: #111827; }
    .delete-btn { background: none; border: none; color: #d1d5db; font-size: 14px; cursor: pointer; padding: 0 4px; }

    /* 통계 화면 */
    .stats-view { flex: 0 0 75%; background-color: #fafafa; overflow-y: auto; padding: 12px; display: none; }
    .income-box { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    .income-box label { font-size: 12px; font-weight: 700; }
    .income-input { width: 120px; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; text-align: right; font-weight: bold; }
    .stats-card { background: #fff; border-radius: 8px; padding: 12px; border: 1px solid #e5e7eb; }
    .stats-card h3 { font-size: 12px; font-weight: 700; margin-bottom: 8px; border-bottom: 1px solid #f3f4f6; padding-bottom: 4px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 4px 0; }
    .bar-container { flex: 1; height: 8px; background: #f3f4f6; border-radius: 4px; margin: 0 10px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; }

    /* 3. 최하단 (1/4): 입력 영역 */
    .bottom-input-area { flex: 0 0 25%; display: flex; align-items: center; padding: 8px 10px; background: #fff; gap: 6px; }
    .preview-badge { background: #e0e7ff; color: #3730a3; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .price-input { flex: 1; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
    .add-btn { background-color: #2563eb; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; height: 100%; max-height: 40px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-calendar">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth">&lt;</button>
      <h2 id="monthYearText"></h2>
      <div class="header-right">
        <button class="mode-btn" id="modeSwitchBtn">📊 통계/수입</button>
        <button class="nav-btn" id="nextMonth">&gt;</button>
      </div>
    </div>
    <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <div class="middle-section" id="inputView">
    <div class="selector-panel">
      <div class="date-col">
        <div class="col-title">📅 날짜</div>
        <div id="verticalDateList" style="display: flex; flex-direction: column; gap: 4px;"></div>
      </div>
      <div class="category-col">
        <div class="col-title">🏷️ 항목 선택</div>
        <div class="category-cloud" id="categoryCloud"></div>
      </div>
    </div>
    <div class="feed-list" id="feedList"></div>
  </div>

  <div class="stats-view" id="statsView">
    <div class="income-box">
      <label>💰 이번 달 월 수입</label>
      <input type="number" class="income-input" id="incomeInput" placeholder="금액 입력">
    </div>
    <div class="stats-card">
      <h3>📈 지출 현황 및 그래프</h3>
      <div id="statsContent"></div>
    </div>
  </div>

  <div class="bottom-input-area" id="bottomInputArea">
    <div class="preview-badge" id="previewBadge">선택중</div>
    <input type="number" class="price-input" id="priceInput" placeholder="금액 입력">
    <button class="add-btn" id="addBtn">추가</button>
  </div>
</div>

<script>
  const categoryColors = { '점심': '#2563eb', '저녁': '#059669', '커피': '#d97706', '택시': '#dc2626', '쇼핑': '#7c3aed', '기타': '#4b5563' };
  let customCategories = JSON.parse(localStorage.getItem('my_expense_cats')) || ['점심', '저녁', '커피', '택시', '쇼핑', '기타'];
  let currentDate = new Date();
  let selectedDate = new Date();
  let selectedCategory = customCategories[0] || '점심';
  let records = JSON.parse(localStorage.getItem('my_expense_app_v2')) || {};
  let monthlyIncomes = JSON.parse(localStorage.getItem('my_monthly_incomes')) || {};
  let isStatsMode = false;

  function saveRecords() { localStorage.setItem('my_expense_app_v2', JSON.stringify(records)); }
  function saveCategories() { localStorage.setItem('my_expense_cats', JSON.stringify(customCategories)); }
  function saveIncomes() { localStorage.setItem('my_monthly_incomes', JSON.stringify(monthlyIncomes)); }

  function formatDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function renderApp() {
    try {
      renderCalendar();
      renderVerticalDates();
      renderCategories();
      renderFeed();
      updatePreview();
      renderStats();
    } catch (e) {
      console.error(e);
    }
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const textEl = document.getElementById('monthYearText');
    if (textEl) textEl.textContent = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const todayKey = formatDateKey(new Date());
    const selectedKey = formatDateKey(selectedDate);
    const grid = document.getElementById('daysGrid');
    if (!grid) return;
    grid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      grid.appendChild(cell);
    }

    for (let d = 1; d <= lastDate; d++) {
      const cellDate = new Date(year, month, d);
      const dateKey = formatDateKey(cellDate);
      const dayOfWeek = cellDate.getDay();
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dayOfWeek === 0) cell.classList.add('sun');
      if (dayOfWeek === 6) cell.classList.add('sat');
      if (dateKey === todayKey) cell.classList.add('today');
      if (dateKey === selectedKey) cell.classList.add('selected');
      cell.innerHTML = `<span>${d}</span>`;
      cell.addEventListener('click', () => { selectedDate = cellDate; renderApp(); });
      grid.appendChild(cell);
    }
  }

  function renderVerticalDates() {
    const list = document.getElementById('verticalDateList');
    if (!list) return;
    list.innerHTML = '';
    for (let i = -7; i <= 7; i++) {
      const target = new Date(selectedDate);
      target.setDate(selectedDate.getDate() + i);
      const dateKey = formatDateKey(target);
      const chip = document.createElement('div');
      chip.className = 'date-chip' + (dateKey === formatDateKey(selectedDate) ? ' active' : '');
      chip.textContent = `${target.getMonth() + 1}/${target.getDate()}`;
      chip.addEventListener('click', () => { selectedDate = target; renderApp(); });
      list.appendChild(chip);
    }
  }

  function renderCategories() {
    const cloud = document.getElementById('categoryCloud');
    if (!cloud) return;
    cloud.innerHTML = '';
    customCategories.forEach(cat => {
      const chip = document.createElement('div');
      chip.className = 'cat-chip';
      const color = categoryColors[cat] || '#2563eb';
      if (selectedCategory === cat) {
        chip.style.backgroundColor = color;
        chip.style.color = '#ffffff';
      } else {
        chip.style.backgroundColor = '#ffffff';
        chip.style.color = color;
        chip.style.borderColor = color;
      }
      chip.textContent = cat;
      chip.addEventListener('click', () => { selectedCategory = cat; renderApp(); });
      cloud.appendChild(chip);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'cat-add-btn';
    addBtn.textContent = '+ 추가';
    addBtn.addEventListener('click', () => {
      const newCat = prompt('새 지출 항목 이름:');
      if (newCat && newCat.trim() && !customCategories.includes(newCat.trim())) {
        const trimmed = newCat.trim();
        customCategories.push(trimmed);
        categoryColors[trimmed] = '#' + Math.floor(Math.random()*16777215).toString(16);
        saveCategories();
        selectedCategory = trimmed;
        renderApp();
      }
    });
    cloud.appendChild(addBtn);
  }

  function updatePreview() {
    const badge = document.getElementById('previewBadge');
    if (badge) {
      badge.textContent = `${selectedDate.getMonth() + 1}/${selectedDate.getDate()} [${selectedCategory}]`;
    }
  }

  function renderFeed() {
    const feedList = document.getElementById('feedList');
    if (!feedList) return;
    feedList.innerHTML = '';
    const sortedKeys = Object.keys(records).filter(k => records[k]?.length > 0).sort();

    if (sortedKeys.length === 0) {
      feedList.innerHTML = '<div class="empty-msg">기록된 지출이 없습니다.</div>';
      return;
    }

    sortedKeys.forEach(dateKey => {
      const items = records[dateKey];
      const [y, m, d] = dateKey.split('-');
      const group = document.createElement('div');
      group.className = 'record-group';
      group.innerHTML = `<div class="record-group-title">${y}년 ${parseInt(m)}월 ${parseInt(d)}일</div>`;

      items.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'record-item';
        const color = categoryColors[item.category] || '#2563eb';
        
        const info = document.createElement('div');
        info.className = 'record-info';
        info.innerHTML = `<span class="badge" style="background-color: ${color};">${item.category}</span><span class="price">${Number(item.price).toLocaleString()}원</span>`;
        info.addEventListener('click', () => {
          const np = prompt('금액 수정:', item.price);
          if (np !== null && !isNaN(parseInt(np))) {
            records[dateKey][index].price = parseInt(np);
            saveRecords();
            renderApp();
          }
        });

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.innerHTML = '&times;';
        del.addEventListener('click', () => {
          records[dateKey].splice(index, 1);
          if (records[dateKey].length === 0) delete records[dateKey];
          saveRecords();
          renderApp();
        });

        itemDiv.appendChild(info);
        itemDiv.appendChild(del);
        group.appendChild(itemDiv);
      });
      feedList.appendChild(group);
    });
  }

  function renderStats() {
    const monthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
    const incomeInput = document.getElementById('incomeInput');
    if (incomeInput) incomeInput.value = monthlyIncomes[monthKey] || '';

    let catTotals = {};
    let totalExpense = 0;
    Object.keys(records).forEach(dateKey => {
      if (dateKey.startsWith(monthKey)) {
        records[dateKey].forEach(item => {
          catTotals[item.category] = (catTotals[item.category] || 0) + item.price;
          totalExpense += item.price;
        });
      }
    });

    const income = monthlyIncomes[monthKey] || 0;
    const balance = income - totalExpense;
    let html = `<div class="stat-row" style="font-weight:700; margin-bottom:6px;"><span>총 수입: ${income.toLocaleString()}원</span><span style="color:#dc2626;">지출: ${totalExpense.toLocaleString()}원</span></div>`;
    html += `<div class="stat-row" style="font-weight:700; margin-bottom:10px; color:${balance >= 0 ? '#2563eb' : '#dc2626'};"><span>잔액: ${balance.toLocaleString()}원</span></div>`;

    if (Object.keys(catTotals).length === 0) {
      html += '<div style="text-align:center; color:#9ca3af; font-size:11px; padding:10px;">이번 달 내역이 없습니다.</div>';
    } else {
      Object.keys(catTotals).forEach(cat => {
        const amt = catTotals[cat];
        const pct = totalExpense > 0 ? Math.round((amt / totalExpense) * 100) : 0;
        const color = categoryColors[cat] || '#2563eb';
        html += `<div style="margin-bottom:6px;"><div class="stat-row"><span>${cat}</span><span>${amt.toLocaleString()}원 (${pct}%)</span></div><div class="bar-container"><div class="bar-fill" style="width: ${pct}%; background-color: ${color};"></div></div></div>`;
      });
    }
    const statsContent = document.getElementById('statsContent');
    if (statsContent) statsContent.innerHTML = html;
  }

  const incomeInputEl = document.getElementById('incomeInput');
  if (incomeInputEl) {
    incomeInputEl.addEventListener('input', (e) => {
      const monthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
      const val = parseInt(e.target.value);
      if (!isNaN(val)) monthlyIncomes[monthKey] = val; else delete monthlyIncomes[monthKey];
      saveIncomes();
      renderStats();
    });
  }

  const modeBtn = document.getElementById('modeSwitchBtn');
  if (modeBtn) {
    modeBtn.addEventListener('click', () => {
      isStatsMode = !isStatsMode;
      document.getElementById('inputView').style.display = isStatsMode ? 'none' : 'flex';
      document.getElementById('statsView').style.display = isStatsMode ? 'block' : 'none';
      document.getElementById('bottomInputArea').style.display = isStatsMode ? 'none' : 'flex';
      modeBtn.textContent = isStatsMode ? '📝 기록하기' : '📊 통계/수입';
      if (isStatsMode) renderStats();
    });
  }

  function addRecord() {
    const input = document.getElementById('priceInput');
    if (!input) return;
    const val = input.value.trim();
    if (!val) return;
    const dateKey = formatDateKey(selectedDate);
    if (!records[dateKey]) records[dateKey] = [];
    records[dateKey].push({ category: selectedCategory, price: parseInt(val) });
    saveRecords();
    input.value = '';
    renderApp();
  }

  const addBtnEl = document.getElementById('addBtn');
  if (addBtnEl) addBtnEl.addEventListener('click', addRecord);
  
  const priceInputEl = document.getElementById('priceInput');
  if (priceInputEl) {
    priceInputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') addRecord(); });
  }

  const prevBtn = document.getElementById('prevMonth');
  if (prevBtn) prevBtn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderApp(); });

  const nextBtn = document.getElementById('nextMonth');
  if (nextBtn) nextBtn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderApp(); });

  renderApp();
</script>

</body>
</html>
