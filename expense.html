<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>모바일 지출 기록기</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #ffffff;
      color: #1f2937;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
    }

    /* 1. 최상단 (1/4): 달력 영역 */
    .top-calendar {
      flex: 0 0 auto;
      border-bottom: 2px solid #e5e7eb;
      background-color: #ffffff;
      padding: 6px 10px 4px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .calendar-header h2 {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
    }

    .nav-btn {
      background: #f3f4f6;
      border: none;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 11px;
      font-weight: bold;
      color: #374151;
      cursor: pointer;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 9px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 1px;
    }

    .weekdays div:first-child { color: #ef4444; }
    .weekdays div:last-child { color: #3b82f6; }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
    }

    .day-cell {
      aspect-ratio: 2.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
      background-color: #f9fafb;
    }

    .day-cell.empty { background: transparent; cursor: default; }
    .day-cell.sun { color: #ef4444; }
    .day-cell.sat { color: #3b82f6; }
    .day-cell.today { font-weight: 800; background-color: #eff6ff; color: #2563eb; }
    .day-cell.selected { background-color: #2563eb; color: #ffffff !important; font-weight: 700; }

    /* 2. 중간 (1/2): 선택 영역 + 지출 내역 피드 */
    .middle-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #fafafa;
      overflow: hidden;
    }

    .selector-panel {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px;
      gap: 8px;
    }

    .select-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .col-title {
      font-size: 11px;
      font-weight: 700;
      color: #4b5563;
    }

    .chips-scroll {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .select-chip {
      padding: 6px 10px;
      font-size: 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background-color: #ffffff;
      color: #374151;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .select-chip.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    /* 하단 피드 목록 */
    .feed-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .empty-msg {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 15px;
    }

    .record-group {
      margin-bottom: 6px;
      background: #ffffff;
      border-radius: 6px;
      padding: 6px 10px;
      border: 1px solid #f0f0f0;
    }

    .record-group-title {
      font-size: 11px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 2px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 2px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 12px;
    }

    .record-info {
      display: flex;
      gap: 8px;
      align-items: center;
      cursor: pointer;
      flex: 1;
    }

    .badge {
      background: #eff6ff;
      color: #2563eb;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }

    .price {
      font-weight: 700;
      color: #111827;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 14px;
      padding: 0 4px;
      cursor: pointer;
    }
    .delete-btn:active { color: #ef4444; }

    /* 3. 최하단 (1/4): 입력 영역 */
    .bottom-input-area {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background-color: #ffffff;
      border-top: 2px solid #e5e7eb;
      gap: 6px;
    }

    .preview-badge {
      background: #e0e7ff;
      color: #3730a3;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .price-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .price-input:focus { border-color: #2563eb; }

    .add-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- 1. 최상단: 달력 -->
  <div class="top-calendar">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth">&lt;</button>
      <h2 id="monthYearText"></h2>
      <button class="nav-btn" id="nextMonth">&gt;</button>
    </div>
    <div class="weekdays">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- 2. 중간: 선택 영역 + 피드 -->
  <div class="middle-section">
    <div class="selector-panel">
      <!-- 왼쪽: 날짜 선택 (가로 스크롤 칩) -->
      <div class="select-col" style="flex: 1.2;">
        <div class="col-title">📅 날짜 선택</div>
        <div class="chips-scroll" id="dateChipsContainer"></div>
      </div>
      <!-- 오른쪽: 항목 선택 (점심, 저녁, 커피 등 그리드) -->
      <div class="select-col" style="flex: 1.8;">
        <div class="col-title">🏷️ 항목 선택</div>
        <div class="category-grid" id="categoryGrid"></div>
      </div>
    </div>

    <div class="feed-list" id="feedList"></div>
  </div>

  <!-- 3. 최하단: 입력 -->
  <div class="bottom-input-area">
    <div class="preview-badge" id="previewBadge">날짜/항목 선택</div>
    <input type="number" class="price-input" id="priceInput" placeholder="금액 입력">
    <button class="add-btn" id="addBtn">추가</button>
  </div>

</div>

<script>
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => {
        e.waitUntil(caches.open('pwa-expense-v2').then(cache => cache.addAll(['./'])));
      });
      self.addEventListener('fetch', e => {
        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
      });
    `;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }

  const categories = ['점심', '저녁', '커피', '택시', '쇼핑', '기타'];
  let currentDate = new Date();
  let selectedDate = new Date();
  let selectedCategory = '점심';

  let records = JSON.parse(localStorage.getItem('my_expense_app_v1')) || {};

  function saveRecords() {
    localStorage.setItem('my_expense_app_v1', JSON.stringify(records));
  }

  function formatDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function renderApp() {
    renderCalendar();
    renderDateChips();
    renderCategories();
    renderFeed();
    updatePreview();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    document.getElementById('monthYearText').textContent = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const todayKey = formatDateKey(new Date());
    const selectedKey = formatDateKey(selectedDate);

    const daysGrid = document.getElementById('daysGrid');
    daysGrid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell empty';
      daysGrid.appendChild(emptyCell);
    }

    for (let d = 1; d <= lastDate; d++) {
      const cellDate = new Date(year, month, d);
      const dateKey = formatDateKey(cellDate);
      const dayOfWeek = cellDate.getDay();

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dayOfWeek === 0) cell.classList.add('sun');
      if (dayOfWeek === 6) cell.classList.add('sat');
      if (dateKey === todayKey) cell.classList.add('today');
      if (dateKey === selectedKey) cell.classList.add('selected');

      const numSpan = document.createElement('span');
      numSpan.textContent = d;
      cell.appendChild(numSpan);

      cell.addEventListener('click', () => {
        selectedDate = cellDate;
        renderApp();
      });

      daysGrid.appendChild(cell);
    }
  }

  function renderDateChips() {
    const container = document.getElementById('dateChipsContainer');
    container.innerHTML = '';

    for (let i = -3; i <= 3; i++) {
      const target = new Date(selectedDate);
      target.setDate(selectedDate.getDate() + i);
      const dateKey = formatDateKey(target);
      
      const chip = document.createElement('div');
      chip.className = 'select-chip' + (dateKey === formatDateKey(selectedDate) ? ' active' : '');
      chip.textContent = `${target.getMonth() + 1}/${target.getDate()}`;
      
      chip.addEventListener('click', () => {
        selectedDate = new Date(target);
        renderApp();
      });
      container.appendChild(chip);
    }
  }

  function renderCategories() {
    const grid = document.getElementById('categoryGrid');
    grid.innerHTML = '';

    categories.forEach(cat => {
      const chip = document.createElement('div');
      chip.className = 'select-chip' + (selectedCategory === cat ? ' active' : '');
      chip.textContent = cat;
      chip.addEventListener('click', () => {
        selectedCategory = cat;
        renderApp();
      });
      grid.appendChild(chip);
    });
  }

  function updatePreview() {
    const m = selectedDate.getMonth() + 1;
    const d = selectedDate.getDate();
    document.getElementById('previewBadge').textContent = `${m}/${d} [${selectedCategory}]`;
  }

  function renderFeed() {
    const feedList = document.getElementById('feedList');
    feedList.innerHTML = '';

    const sortedKeys = Object.keys(records).filter(k => records[k] && records[k].length > 0).sort();

    if (sortedKeys.length === 0) {
      feedList.innerHTML = '<div class="empty-msg">기록된 지출이 없습니다.<br>날짜와 항목을 고르고 금액을 입력해 보세요!</div>';
      return;
    }

    sortedKeys.forEach(dateKey => {
      const items = records[dateKey];
      if (items.length === 0) return;

      const [y, m, d] = dateKey.split('-');
      const groupDiv = document.createElement('div');
      groupDiv.className = 'record-group';

      const titleDiv = document.createElement('div');
      titleDiv.className = 'record-group-title';
      titleDiv.textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
      groupDiv.appendChild(titleDiv);

      items.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'record-item';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'record-info';
        infoDiv.innerHTML = `<span class="badge">${item.category}</span><span class="price">${Number(item.price).toLocaleString()}원</span>`;
        
        infoDiv.addEventListener('click', () => {
          const newPrice = prompt(`[${item.category}] 금액 수정:`, item.price);
          if (newPrice !== null) {
            const val = parseInt(newPrice);
            if (!isNaN(val)) {
              records[dateKey][index].price = val;
              saveRecords();
              renderFeed();
            }
          }
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '&times;';
        delBtn.addEventListener('click', () => {
          records[dateKey].splice(index, 1);
          if (records[dateKey].length === 0) delete records[dateKey];
          saveRecords();
          renderApp();
        });

        itemDiv.appendChild(infoDiv);
        itemDiv.appendChild(delBtn);
        groupDiv.appendChild(itemDiv);
      });

      feedList.appendChild(groupDiv);
    });
  }

  function addRecord() {
    const input = document.getElementById('priceInput');
    const priceVal = input.value.trim();
    if (!priceVal) return;

    const dateKey = formatDateKey(selectedDate);
    if (!records[dateKey]) {
      records[dateKey] = [];
    }

    records[dateKey].push({ category: selectedCategory, price: parseInt(priceVal) });
    saveRecords();
    input.value = '';
    renderApp();
  }

  document.getElementById('addBtn').addEventListener('click', addRecord);
  document.getElementById('priceInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addRecord();
  });

  document.getElementById('prevMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  renderApp();
</script>

</body>
</html>
